version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trackr_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackr_password}
      POSTGRES_DB: ${POSTGRES_DB:-trackr_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trackr} -d ${POSTGRES_DB:-trackr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trackr_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackr_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-Trackr}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trackr}:${POSTGRES_PASSWORD:-trackr_password}@postgres:5432/${POSTGRES_DB:-trackr_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackr_worker
    restart: always
    command: python -m app.worker
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-Trackr}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trackr}:${POSTGRES_PASSWORD:-trackr_password}@postgres:5432/${POSTGRES_DB:-trackr_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trackr_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
